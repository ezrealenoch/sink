[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sink-coord"
version = "0.1.0"
description = "Multi-agent coordination via append-only event logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Enoch Wang", email = "enochsurge@gmail.com" },
]
maintainers = [
    { name = "Enoch Wang", email = "enochsurge@gmail.com" },
    { name = "Claude (Anthropic)" },
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
sink = "sink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sink"]
